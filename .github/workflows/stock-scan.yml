name: Stock Opportunity Scan

on:
  schedule:
    # All times UTC. Runs Mon-Fri only ("1-5" = Monday-Friday).
    # Tuned to US market hours at GMT+2 (open 15:30, close 22:00 GMT+2 = 13:30-20:00 UTC):
    # runs hourly at :30 past, from market open through close.
    - cron: '30 13-19 * * 1-5'
  workflow_dispatch: {} # lets you manually trigger a run from the Actions tab, for testing

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run stock scan
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node check-stocks.js
